<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Hermeneus subtitles</title>
<style>
/* Colours, type and spacing come from the shared overlay token table; the server writes them
   here for each request (overlay_page.theme_css). */
/*HERMENEUS_THEME*/
:root {
  --text-size: 26px;
  --box-opacity: 0.8;
}
html, body {
  margin: 0;
  background: transparent;
  overflow: hidden;
}
[hidden] { display: none !important; }
#subtitles {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 6vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3em;
  font-family: var(--font-sans);
  font-size: var(--text-size);
  line-height: 1.3;
}
.line {
  position: relative;
  isolation: isolate;
  max-width: min(92vw, 40em);
  padding: 0.2em 0.55em;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  color: var(--text-primary);
  font-weight: var(--text-weight);
  text-shadow: 0 0 0.1em var(--surface), 0 0 0.25em var(--surface);
  overflow-wrap: anywhere;
}
.line::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background: var(--surface);
  opacity: var(--box-opacity);
}
.original {
  order: var(--original-order);
  max-width: 100%;
  font-size: var(--original-scale);
  color: var(--text-secondary);
  /* One row, as on the native strip: its start with an ellipsis, or its end when the
     translation rolled (fitTail below). */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.main { display: block; }
.speaker {
  font-size: var(--label-scale);
  font-weight: var(--label-weight);
  margin-inline-end: 0.5em;
  /* Compact: the number in a thin pill of the speaker's colour. */
  display: inline-block;
  min-width: 1em;
  padding: 0 0.3em;
  border: 1.5px solid currentColor;
  border-radius: 1em;
  text-align: center;
  line-height: 1.25;
  vertical-align: 0.15em;
}
/* "Translating": one small dot in a faint ring on a spot of its own below the lines, as on the native
   strip, so it never reads as a "..." continuation of the text. It sits on a small box in the
   subtitle colours, at least 85% opaque, so it stays visible over any video. */
#pending {
  position: relative;
  isolation: isolate;
  width: 1.2em;
  height: 0.8em;
  margin-top: 0.1em;
  border-radius: var(--radius);
  color: var(--text-secondary);
}
#pending::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background: var(--surface);
  opacity: max(var(--box-opacity), 0.85);
}
#pending::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0.3em;
  height: 0.3em;
  margin: -0.15em 0 0 -0.15em;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 0.1em var(--surface), 0 0 0 0.17em currentColor;
}
:root[data-see-through] #pending { color: #e6edf3; }
:root[data-see-through] #pending::before { background: #161b22; }
/* Under 50% background the video shows through: light text with a thin dark edge in every theme, as TV
   subtitles are (the native strip's theme.see_through). */
:root[data-see-through] .line {
  color: #e6edf3;
  text-shadow: -1px 0 #000, 1px 0 #000, 0 -1px #000, 0 1px #000, 0 0 0.12em #000, 0 0 0.3em rgba(0, 0, 0, 0.8);
}
:root[data-see-through] .line::before { background: #161b22; }
:root[data-see-through] .original, :root[data-see-through] .failed .text { color: rgba(230, 237, 243, 0.8); }
.speaker[data-slot="1"] { color: var(--speaker-1); }
.speaker[data-slot="2"] { color: var(--speaker-2); }
.speaker[data-slot="3"] { color: var(--speaker-3); }
.speaker[data-slot="4"] { color: var(--speaker-4); }
.speaker[data-slot="5"] { color: var(--speaker-5); }
.speaker[data-slot="6"] { color: var(--speaker-6); }
.text { transition: color 120ms linear; }
.pending .text { color: var(--text-pending); }
.failed .text { color: var(--text-failed); }
/* A failed line starts with a marker in --ui-red, as the pane marks it (shared table:
   hermeneus_engine/overlay_tokens.py, role "failed"). Its words come from the pane's i18n copy
   with the theme, the same words the native strip draws (overlay/model.py Strings). */
.marker {
  color: var(--failed);
  font-size: var(--label-scale);
  font-weight: var(--label-weight);
  margin-inline-end: 0.5em;
}
</style>
</head>
<body>
<main id="subtitles" aria-live="polite"></main>
<script type="application/json" id="hermeneus-settings">{}/*HERMENEUS_SETTINGS*/</script>
<script>
(function (root) {
  'use strict'

  // Limits and defaults mirror hermeneus_engine/overlay_settings.py.
  var LIMITS = { text_size: [14, 64], max_lines: [1, 6], opacity: [0, 100], reading_cps: [0, 30] }
  var DEFAULTS = { text_size: 26, max_lines: 2, show_original: false, opacity: 90, show_speaker: true, theme: 'auto',
    pace: 'read', reading_cps: 0 }
  var PACES = ['read', 'live']
  // The display queue, as on the native strip (hermeneus_engine/overlay/pace.py): a line goes up when its
  // translation is ready, in speech order, and stays its reading time (characters / cps, at least MIN_S)
  // before the next one. "live" shortens that, down to half, while more than LIVE_BACKLOG_S waits.
  var READING_CPS = { tr: 17, en: 20, zh: 9, ja: 4, ko: 12 }
  var DEFAULT_CPS = 17
  var MIN_S = 1.0
  var HOLD_S = 7.0
  var ORDER_WAIT_S = 6.0
  var LIVE_BACKLOG_S = 3.0
  var LIVE_MAX_SPEEDUP = 2.0
  // A paced unit (pace.py UNIT_CHARS, CHUNK_CHARS): a sentence that fits max_lines rows, or even phrase
  // units of a longer one. The page measures its row width (unitCharsFor); this is the fallback.
  var UNIT_CHARS = 84
  var UNIT_MIN_CHARS = 16
  // banner: the opt-in overlay_style colours (overlay_tokens.BANNER); the server setting picks it as the default.
  var THEMES = ['auto', 'light', 'dark', 'banner']
  var LINE_STATES = ['partial', 'committed', 'translated', 'failed']
  var RUNNING = ['starting', 'live', 'reconnecting']
  var SPEAKER_SLOTS = 6
  // Lines kept in memory; the page shows at most three.
  var KEEP = 20

  function has(obj, key) {
    return Object.prototype.hasOwnProperty.call(obj, key)
  }

  function toBool(value, fallback) {
    if (typeof value === 'boolean') return value
    if (typeof value === 'number') return value !== 0
    if (typeof value === 'string') {
      var low = value.trim().toLowerCase()
      if (['1', 'true', 'yes', 'on'].indexOf(low) !== -1) return true
      if (['0', 'false', 'no', 'off'].indexOf(low) !== -1) return false
    }
    return fallback
  }

  function toInt(value, fallback, limits) {
    if (typeof value === 'boolean' || value === null || value === undefined || value === '') return fallback
    var n = Math.trunc(Number(value))
    if (!Number.isFinite(n)) return fallback
    return Math.max(limits[0], Math.min(limits[1], n))
  }

  /** Settings from the server (the plugin's shared overlay settings), then the URL query,
   *  so each OBS source can be tuned on its own. */
  function resolveSettings(base, query) {
    base = base && typeof base === 'object' ? base : {}
    var params = new URLSearchParams(query || '')
    function pick(key) {
      return params.has(key) ? params.get(key) : base[key]
    }
    var theme = String(pick('theme') || (base.style === 'banner' ? 'banner' : 'auto')).toLowerCase()
    return {
      text_size: toInt(pick('text_size'), DEFAULTS.text_size, LIMITS.text_size),
      max_lines: toInt(pick('max_lines'), DEFAULTS.max_lines, LIMITS.max_lines),
      show_original: toBool(pick('show_original'), DEFAULTS.show_original),
      opacity: toInt(pick('opacity'), DEFAULTS.opacity, LIMITS.opacity),
      show_speaker: toBool(pick('show_speaker'), DEFAULTS.show_speaker),
      theme: THEMES.indexOf(theme) === -1 ? 'auto' : theme,
      pace: PACES.indexOf(String(pick('pace') || '').toLowerCase()) === -1 ? DEFAULTS.pace : String(pick('pace')).toLowerCase(),
      reading_cps: readingCpsSetting(pick('reading_cps'))
    }
  }

  function readingCpsSetting(value) {
    var n = toInt(value, DEFAULTS.reading_cps, LIMITS.reading_cps)
    return n === 0 ? 0 : Math.max(5, n)
  }
  function createState() {
    // seen: when a line first arrived; ready: when it became final; shown: when it went on screen.
    return { seq: null, lines: [], speakers: {}, speakerCount: 0, status: null,
      seen: {}, ready: {}, shown: {}, freeAt: 0, lastShown: null, clearedAt: -Infinity, activeAt: 0 }
  }

  function text(value) {
    return typeof value === 'string' ? value : ''
  }

  // Speaker N by first appearance, as the pane numbers them (desktop/plugin.js withSpeaker,
  // applyRelabel, speakerNumber).
  function withSpeaker(state, id) {
    if (id === null || has(state.speakers, id)) return state
    var speakers = Object.assign({}, state.speakers)
    speakers[id] = state.speakerCount + 1
    return Object.assign({}, state, { speakers: speakers, speakerCount: state.speakerCount + 1 })
  }

  function applyLine(state, raw, now) {
    if (!raw || typeof raw !== 'object' || typeof raw.line_id !== 'string' || LINE_STATES.indexOf(raw.state) === -1) {
      return state
    }
    var line = {
      line_id: raw.line_id,
      state: raw.state,
      original: text(raw.original),
      translation: text(raw.translation),
      speaker_id: typeof raw.speaker_id === 'string' && raw.speaker_id !== '' ? raw.speaker_id : null,
      target_language: typeof raw.target_language === 'string' ? raw.target_language : ''
    }
    var lines = state.lines.slice()
    var index = -1
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].line_id === line.line_id) { index = i; break }
    }
    if (index === -1) lines.push(line)
    else lines[index] = line
    if (lines.length > KEEP) lines = lines.slice(lines.length - KEEP)
    var seen = state.seen
    var ready = state.ready
    if (!has(seen, line.line_id)) { seen = Object.assign({}, seen); seen[line.line_id] = now }
    if (isFinal(line) && !has(ready, line.line_id)) { ready = Object.assign({}, ready); ready[line.line_id] = now }
    return Object.assign({}, withSpeaker(state, line.speaker_id), { lines: lines, seen: seen, ready: ready, activeAt: now })
  }

  function applyRelabel(state, from, to) {
    if (typeof from !== 'string' || typeof to !== 'string' || !from || !to || from === to) return state
    var lines = state.lines.map(function (line) {
      return line.speaker_id === from ? Object.assign({}, line, { speaker_id: to }) : line
    })
    var speakers = state.speakers
    if (!has(speakers, to) && has(speakers, from)) {
      speakers = Object.assign({}, speakers)
      speakers[to] = speakers[from]
    }
    return Object.assign({}, state, { lines: lines, speakers: speakers })
  }

  function clearLines(state) {
    return Object.assign({}, state, { lines: [], seen: {}, ready: {}, shown: {}, freeAt: 0, lastShown: null,
      clearedAt: -Infinity })
  }
  function isFinal(line) {
    return line.state === 'translated' || line.state === 'failed'
  }

  /** One event from the stream (docs/events.md). An event whose seq is not above the
   *  last applied one is a duplicate. hello sets the state only; reset drops the lines. */
  function applyEvent(state, event, now) {
    if (!event || typeof event !== 'object') return state
    now = typeof now === 'number' ? now : 0
    var seq = Number.isInteger(event.seq) ? event.seq : null
    if (event.type === 'hello') {
      var session = event.session
      return session && typeof session.state === 'string' ? Object.assign({}, state, { status: session.state }) : state
    }
    if (event.type === 'reset') return Object.assign(clearLines(state), { seq: seq })
    if (event.type === 'lost') return clearLines(state)
    if (seq !== null && state.seq !== null && seq <= state.seq) return state
    var next = state
    if (event.type === 'line') next = applyLine(state, event.line, now)
    else if (event.type === 'relabel') next = applyRelabel(state, event.from, event.to)
    else if (event.type === 'status' && typeof event.state === 'string') {
      // A new run has new line and speaker ids, so the list and the numbering start again.
      if (event.state === 'starting' && RUNNING.indexOf(state.status) === -1) {
        next = Object.assign(createState(), { status: event.state })
      } else {
        next = Object.assign({}, state, { status: event.state })
      }
    }
    return seq === null ? next : Object.assign({}, next, { seq: seq })
  }

  /** The words the page draws; the pane's localised copy replaces them (theme event "strings"). */
  var WORDS = { speaker: 'Speaker {n}', not_translated: 'Not translated' }

  function applyWords(words, strings) {
    var out = { speaker: words.speaker, not_translated: words.not_translated }
    if (!strings || typeof strings !== 'object') return out
    if (typeof strings.speaker === 'string' && strings.speaker.indexOf('{n}') !== -1) out.speaker = strings.speaker
    if (typeof strings.not_translated === 'string' && strings.not_translated !== '') out.not_translated = strings.not_translated
    return out
  }

  function readingCps(language, override) {
    if (override) return Math.max(5, Math.min(30, override))
    var base = String(language || '').toLowerCase().replace('_', '-').split('-')[0]
    return has(READING_CPS, base) ? READING_CPS[base] : DEFAULT_CPS
  }
  function readingTime(value, cps) {
    var n = String(value).trim().replace(/\s+/g, ' ').length
    return Math.max(MIN_S, (n || 8) / cps)
  }
  /** The words a line puts on screen: its translation; for a line that was not translated, its
   *  original only when the user asked for originals (the marker says the rest). */
  function shownText(line, settings) {
    if (line.state === 'translated' && line.translation.trim() !== '') return line.translation
    return settings.show_original ? line.original : ''
  }
  // Phrase boundaries, as in pace.py: after punctuation, before a conjunction or preposition, after a
  // Turkish postposition.
  var ENDS_PHRASE = /[,;:.!?\u2026\u2014\u2013)\]"\u201d\u00bb]$/
  var BREAK_BEFORE = ('and but or nor so yet because although though while whereas which who whom whose where when if unless ' +
    'until since than that as after before about with without from into for of on in at to by between during ' +
    've ama fakat ancak lakin oysa halbuki veya ya yahut yoksa \u00e7\u00fcnk\u00fc zira e\u011fer ' +
    'et mais ou donc car que qui dont o\u00f9 quand si y pero porque aunque und aber oder weil dass wenn als ' +
    'e ma perch\u00e9 quando').split(' ')
  var BREAK_AFTER = ('gibi kadar i\u00e7in sonra \u00f6nce ra\u011fmen kar\u015f\u0131n g\u00f6re beri dolay\u0131 do\u011fru itibaren').split(' ')
  function bare(word) {
    return word.replace(/^["'\u201c\u201d\u00ab\u00bb()]+|["'\u201c\u201d\u00ab\u00bb()]+$/g, '').toLowerCase()
  }
  function breakBefore(prev, word) {
    if (!prev || !word) return false
    if (ENDS_PHRASE.test(prev)) return true
    return BREAK_BEFORE.indexOf(bare(word)) !== -1 || BREAK_AFTER.indexOf(bare(prev)) !== -1
  }
  /** pace.split_phrases: the fewest units of at most `limit` characters, of about even length, each cut
   *  at the phrase boundary nearest that length, never inside a word. Joined with spaces they give the
   *  text back word for word. */
  function splitPhrases(value, limit) {
    var words = String(value).split(/\s+/).filter(function (w) { return w !== '' })
    if (words.length === 0) return ['']
    var units = []
    var total = Math.max(1, Math.ceil(words.join(' ').length / limit))
    while (words.length) {
      var rest = words.join(' ')
      if (rest.length <= limit) { units.push(rest); break }
      var parts = Math.max(total - units.length, Math.ceil(rest.length / limit))
      var target = rest.length / parts
      var best = 1
      var bestScore = null
      for (var k = 1; k < words.length; k++) {
        var size = words.slice(0, k).join(' ').length
        if (size > limit) break
        var score = Math.abs(size - target) - (breakBefore(words[k - 1], words[k]) ? limit * 0.4 : 0)
        if (bestScore === null || score < bestScore) { best = k; bestScore = score }
      }
      units.push(words.slice(0, best).join(' '))
      words = words.slice(best)
    }
    return units
  }
  /** The unit size for a row width of `rowChars` characters (app.py _unit_chars). */
  function unitCharsFor(rowChars, maxLines) {
    if (!(rowChars > 0)) return UNIT_CHARS
    return Math.floor(Math.max(UNIT_MIN_CHARS, Math.min(UNIT_CHARS, 0.85 * maxLines * rowChars)))
  }
  function unitKey(line, index) {
    return index === 0 ? line.line_id : line.line_id + '#' + index
  }
  /** A line's paced units: {key, index, text, line}. The first keeps the line id, so a short line is one
   *  unit under its own id. A line that was not translated is one unit (its marker, and its original
   *  only with show_original). */
  function unitsOf(line, settings) {
    var value = shownText(line, settings)
    var parts = value.trim() === '' ? [''] : splitPhrases(value, settings.unit_chars || UNIT_CHARS)
    return parts.map(function (part, index) { return { key: unitKey(line, index), index: index, text: part, line: line } })
  }
  /** Units waiting for their turn on screen, in speech order. A line still being translated holds
   *  the ones after it for at most ORDER_WAIT_S; partial lines (words still being spoken) never enter. */
  function waiting(state, now, settings) {
    var out = []
    var blocked = false
    for (var i = 0; i < state.lines.length; i++) {
      var line = state.lines[i]
      if (line.state === 'partial') continue
      if (!isFinal(line)) {
        if (now - (has(state.seen, line.line_id) ? state.seen[line.line_id] : now) < ORDER_WAIT_S) blocked = true
        continue
      }
      if (line.state === 'translated' && line.translation === '' && line.original === '') continue
      var units = unitsOf(line, settings)
      for (var u = 0; u < units.length; u++) {
        if (has(state.shown, units[u].key)) continue
        if (blocked && !has(state.shown, line.line_id)) break // the line has not started: it waits its turn
        out.push(units[u])
      }
    }
    return out
  }
  /** Put every line whose turn has come on screen; clear the page HOLD_S after the last one went up and
   *  the last line event arrived (no clearing while words are still coming in). */
  function advance(state, now, settings) {
    var shown = state.shown
    var freeAt = state.freeAt
    var lastShown = state.lastShown
    var changed = false
    for (;;) {
      var queue = waiting(Object.assign({}, state, { shown: shown }), now, settings)
      if (queue.length === 0) break
      var unit = queue[0]
      var line = unit.line
      var start = Math.max(has(state.ready, line.line_id) ? state.ready[line.line_id] : now, freeAt)
      if (start > now + 1e-9) break
      if (now - start > 0.5) start = now // the page slept: no burst of stale lines
      var cps = readingCps(line.target_language, settings.reading_cps)
      var dwell = readingTime(unit.text, cps)
      if (settings.pace === 'live') {
        var backlog = 0
        for (var k = 0; k < queue.length; k++) {
          backlog += readingTime(queue[k].text, readingCps(queue[k].line.target_language, settings.reading_cps))
        }
        if (backlog > LIVE_BACKLOG_S) dwell = Math.max(MIN_S, dwell / LIVE_MAX_SPEEDUP, dwell * LIVE_BACKLOG_S / backlog)
      }
      if (!changed) shown = Object.assign({}, shown)
      shown[unit.key] = start
      freeAt = start + dwell
      lastShown = start
      changed = true
    }
    var clearedAt = state.clearedAt
    if (lastShown !== null && clearedAt < lastShown && waiting(Object.assign({}, state, { shown: shown }), now, settings).length === 0 &&
        now > Math.max(lastShown, state.activeAt) + HOLD_S && now > freeAt) {
      clearedAt = now
      changed = true
    }
    if (!changed) return state
    return Object.assign({}, state, { shown: shown, freeAt: freeAt, lastShown: lastShown, clearedAt: clearedAt })
  }
  /** Every final line on screen at once, ignoring time (tests and a first look at a stream). */
  function settle(state, settings) {
    settings = settings || DEFAULTS
    var shown = Object.assign({}, state.shown)
    var lastShown = state.lastShown
    for (var i = 0; i < state.lines.length; i++) {
      if (!isFinal(state.lines[i])) continue
      var units = unitsOf(state.lines[i], settings)
      for (var u = 0; u < units.length; u++) {
        if (!has(shown, units[u].key)) { shown[units[u].key] = 0; lastShown = 0 }
      }
    }
    return Object.assign({}, state, { shown: shown, lastShown: lastShown, clearedAt: -Infinity })
  }
  /** Speech was heard whose translation is not on screen yet: the page shows its small "translating" dot. */
  function pendingIndicator(state) {
    if (state.status !== null && RUNNING.indexOf(state.status) === -1) return false
    return state.lines.some(function (line) {
      return line.state === 'committed' || (line.state === 'partial' && line.original !== '')
    })
  }
  /** pace.continues_sentence: the text starts inside a sentence: with a lowercase letter, or, in a
   *  script without case, after the same speaker's text `before` left the sentence open. */
  var SENTENCE_END = /[.!?\u2026:"\u201d\u00bb)\u3002\uff01\uff1f]$/
  function continuesSentence(before, value) {
    var start = String(value || '').trim().match(/[\p{L}\p{N}]/u)
    if (!start) return false
    var ch = start[0]
    var lower = ch.toLowerCase()
    var upper = ch.toUpperCase()
    if (ch === lower && ch !== upper) return true
    if (ch === upper && ch !== lower) return false
    before = String(before || '').trim()
    return before !== '' && !SENTENCE_END.test(before)
  }
  /** What the page draws: the units the queue put up (target language only unless show_original), newest
   *  last; fit() then keeps them to max_lines rendered rows. One rule with the native strip (overlay/pace.py):
   *  a long line goes up in units that each fit the rows, so every word is shown; a line that was not
   *  translated shows its marker, and its original only with show_original. */
  function visibleLines(state, settings, words) {
    words = words || WORDS
    if (state.status !== null && RUNNING.indexOf(state.status) === -1) return []
    var shown = []
    for (var i = 0; i < state.lines.length; i++) {
      var line = state.lines[i]
      if (!isFinal(line) || (line.state === 'translated' && line.translation === '' && line.original === '')) continue
      var units = unitsOf(line, settings)
      var lineUnits = units.filter(function (u) { return has(state.shown, u.key) && state.shown[u.key] >= state.clearedAt })
      for (var j = 0; j < lineUnits.length; j++) {
        lineUnits[j].last = j === lineUnits.length - 1
        shown.push(lineUnits[j])
      }
    }
    var kept = shown.slice(-settings.max_lines)
    return kept.map(function (unit, index) {
      var line = unit.line
      var translated = line.state === 'translated' && line.translation !== ''
      var number = line.speaker_id !== null && has(state.speakers, line.speaker_id) ? state.speakers[line.speaker_id] : null
      // Only a new turn carries the label (the unit before it, shown or gone, had another speaker).
      var before = shown[shown.length - kept.length + index - 1]
      if (before && before.line.speaker_id === line.speaker_id) number = number === null ? null : -number
      var failed = !translated
      // The unit starts inside a sentence: a later unit of its line, or a line that starts inside one.
      var same = before !== undefined && before.line.speaker_id === line.speaker_id && before.line.state === 'translated'
      var continues = unit.index > 0 || (!failed && continuesSentence(same ? before.text : '', unit.text))
      return {
        id: unit.key,
        text: unit.text,
        pending: false,
        failed: failed,
        continues: continues,
        marker: failed && unit.index === 0 ? words.not_translated : '',
        // The original rides on the line's newest unit on screen.
        original: settings.show_original && translated && line.original !== '' && unit.last ? line.original : '',
        // Compact: the speaker's number in a pill of the speaker's colour (the full words are its title).
        speaker: settings.show_speaker && number !== null && number > 0 ? String(number) : '',
        speakerTitle: settings.show_speaker && number !== null ? words.speaker.replace('{n}', String(Math.abs(number))) : '',
        slot: number === null ? 0 : ((Math.abs(number) - 1) % SPEAKER_SLOTS) + 1
      }
    })
  }
  /** Tokens a line can lose from its front when it rolls: words, or characters for text
   *  written without spaces. */
  function tokensOf(value) {
    var trimmed = String(value).trim()
    if (trimmed === '') return { parts: [], joiner: ' ' }
    return /\s/.test(trimmed) ? { parts: trimmed.split(/\s+/), joiner: ' ' } : { parts: Array.from(trimmed), joiner: '' }
  }

  /** The row limit, the native strip's rule (overlay/model.py layout and _fit_turn): Lines is a
   *  number of rendered rows. Older lines leave whole while the rows overflow; when the newest
   *  line alone needs more rows, tokens leave from its front so its newest words stay visible.
   *  rowsOf(i, cut) is the row count of view i without its first `cut` tokens.
   *  Returns { first: index of the oldest line kept, cut: tokens dropped from the newest }. */
  function fitRows(tokenCounts, maxLines, rowsOf) {
    var count = tokenCounts.length
    if (count === 0) return { first: 0, cut: 0 }
    var rows = []
    var total = 0
    for (var i = 0; i < count; i++) {
      rows.push(rowsOf(i, 0))
      total += rows[i]
    }
    var first = 0
    while (count - first > 1 && total > maxLines) {
      total -= rows[first]
      first++
    }
    var newest = count - 1
    var cut = 0
    if (rows[newest] > maxLines) {
      var lo = 1
      var hi = Math.max(tokenCounts[newest] - 1, 1)
      while (lo < hi) { // the smallest cut that fits; rows only shrink as the cut grows
        var mid = (lo + hi) >> 1
        if (rowsOf(newest, mid) <= maxLines) hi = mid
        else lo = mid + 1
      }
      cut = Math.min(lo, Math.max(tokenCounts[newest] - 1, 0))
    }
    return { first: first, cut: cut }
  }

  var VAR_NAME = /^--[a-z0-9-]+$/

  /** The CSS variables to set for a theme event ({tokens: theme_tokens()} from the server):
   *  the forced mode when ?theme= names one, otherwise Desktop's mode when the pane sent a
   *  theme, otherwise the system appearance. */
  function themeVars(tokens, mode, prefersDark) {
    if (!tokens || typeof tokens !== 'object') return null
    var pick = mode === 'light' || mode === 'dark' || mode === 'banner' ? tokens[mode]
      : tokens.follow_system === false ? tokens['default']
        : tokens[prefersDark ? 'dark' : 'light']
    var out = {}
    var sources = [tokens.common, pick]
    for (var i = 0; i < sources.length; i++) {
      var src = sources[i]
      if (!src || typeof src !== 'object') return null
      for (var name in src) {
        if (has(src, name) && VAR_NAME.test(name) && typeof src[name] === 'string') out[name] = src[name]
      }
    }
    return out
  }

  root.HermeneusOverlay = {
    themeVars: themeVars,
    DEFAULTS: DEFAULTS,
    LIMITS: LIMITS,
    resolveSettings: resolveSettings,
    createState: createState,
    applyEvent: applyEvent,
    applyWords: applyWords,
    visibleLines: visibleLines,
    advance: advance,
    settle: settle,
    pendingIndicator: pendingIndicator,
    readingCps: readingCps,
    splitPhrases: splitPhrases,
    unitCharsFor: unitCharsFor,
    continuesSentence: continuesSentence,
    tokensOf: tokensOf,
    fitRows: fitRows
  }

  if (typeof document === 'undefined') return

  // -- page --------------------------------------------------------------------

  var LOST_AFTER_MS = 4000
  var base = {}
  try {
    base = JSON.parse(document.getElementById('hermeneus-settings').textContent)
  } catch (e) {
    base = {}
  }
  var settings = resolveSettings(base, root.location.search)
  var docStyle = document.documentElement.style
  docStyle.setProperty('--text-size', settings.text_size + 'px')
  docStyle.setProperty('--box-opacity', String(settings.opacity / 100))
  if (settings.theme !== 'auto') document.documentElement.setAttribute('data-theme', settings.theme)
  if (settings.opacity < 50) document.documentElement.setAttribute('data-see-through', '')
  function clock() {
    return (root.performance && root.performance.now ? root.performance.now() : Date.now()) / 1000
  }

  var container = document.getElementById('subtitles')
  var nodes = {}
  var state = createState()

  function setText(el, value) {
    if (el.textContent !== value) el.textContent = value
  }

  function makeNode() {
    var rootEl = document.createElement('div')
    rootEl.className = 'line'
    var original = document.createElement('span')
    original.className = 'original'
    var main = document.createElement('span')
    main.className = 'main'
    var speaker = document.createElement('span')
    speaker.className = 'speaker'
    var marker = document.createElement('span')
    marker.className = 'marker'
    var body = document.createElement('span')
    body.className = 'text'
    main.appendChild(speaker)
    main.appendChild(marker)
    main.appendChild(body)
    rootEl.appendChild(original)
    rootEl.appendChild(main)
    return { root: rootEl, original: original, speaker: speaker, marker: marker, text: body, main: main }
  }

  // Each line keeps its element while it changes, so a partial is replaced in place by its
  // translation and nothing is torn down and rebuilt.
  // How many characters one row holds at this width and text size, measured on a hidden line, so a
  // paced unit always fits max_lines rows and is never cut (app.py _unit_chars on the strip).
  var SAMPLE = 'Bu c\u00fcmle sat\u0131r\u0131n ka\u00e7 harf ald\u0131\u011f\u0131n\u0131 \u00f6l\u00e7er ve sonra devam eder. '
  function measureUnitChars() {
    var probe = makeNode()
    probe.root.style.visibility = 'hidden'
    probe.root.style.position = 'absolute'
    var value = ''
    while (value.length < 400) value += SAMPLE
    value = value.trim()
    probe.text.textContent = value
    container.appendChild(probe.root)
    var rows = rowsIn(probe.main)
    probe.root.remove()
    return unitCharsFor(rows > 0 ? value.length / rows : 0, settings.max_lines)
  }

  function render() {
    if (!settings.unit_chars) settings.unit_chars = measureUnitChars()
    var views = visibleLines(state, settings, words)
    var keep = {}
    for (var i = 0; i < views.length; i++) {
      var view = views[i]
      var node = nodes[view.id] || (nodes[view.id] = makeNode())
      setText(node.original, view.original)
      node.original.hidden = view.original === ''
      setText(node.speaker, view.speaker)
      node.speaker.hidden = view.speaker === ''
      if (view.speakerTitle) node.speaker.title = view.speakerTitle
      node.speaker.setAttribute('data-slot', String(view.slot))
      setText(node.marker, view.marker)
      node.marker.hidden = view.marker === ''
      setText(node.text, view.text)
      node.root.classList.toggle('pending', view.pending)
      node.root.classList.toggle('failed', view.failed)
      if (container.children[i] !== node.root) container.insertBefore(node.root, container.children[i] || null)
      keep[view.id] = true
    }
    Object.keys(nodes).forEach(function (id) {
      if (!keep[id]) {
        nodes[id].root.remove()
        delete nodes[id]
      }
    })
    var dots = pendingIndicator(state)
    pendingEl.hidden = !dots
    container.appendChild(pendingEl)
    fit(views)
  }
  var pendingEl = document.createElement('div')
  pendingEl.id = 'pending'
  pendingEl.setAttribute('aria-hidden', 'true')
  pendingEl.hidden = true

  function rowsIn(el) {
    var lineHeight = parseFloat(root.getComputedStyle(el).lineHeight)
    if (!(lineHeight > 0)) return 1
    return Math.max(1, Math.round(el.getBoundingClientRect().height / lineHeight))
  }

  // An ellipsis and as much of the end of `value` as fits on the element's one row.
  function fitTail(el, value) {
    var tokens = tokensOf(value)
    el.textContent = value
    if (el.scrollWidth <= el.clientWidth || tokens.parts.length < 2) return
    var lo = 1
    var hi = tokens.parts.length - 1
    while (lo < hi) {
      var mid = (lo + hi) >> 1
      el.textContent = '\u2026' + tokens.parts.slice(mid).join(tokens.joiner)
      if (el.scrollWidth <= el.clientWidth) hi = mid
      else lo = mid + 1
    }
    el.textContent = '\u2026' + tokens.parts.slice(lo).join(tokens.joiner)
  }

  // Lines is a row limit (fitRows). Every candidate line is shown with its full text before
  // anything is measured, because a line the previous update hid measures 0 high. The show,
  // measure, hide and cut steps run in one task, before the browser paints, so no line is
  // drawn in a state it does not end in.
  function fit(views) {
    if (views.length === 0) return
    var list = views.map(function (view) { return { node: nodes[view.id], tokens: tokensOf(view.text), view: view } })
    for (var k = 0; k < list.length; k++) {
      list[k].node.root.hidden = false
      setText(list[k].node.text, list[k].view.text)
    }
    var result = fitRows(list.map(function (item) { return item.tokens.parts.length }), settings.max_lines,
      function (i, cut) {
        var item = list[i]
        if (cut > 0) item.node.text.textContent = '\u2026' + item.tokens.parts.slice(cut).join(item.tokens.joiner)
        var rows = rowsIn(item.node.main)
        if (cut > 0) item.node.text.textContent = item.view.text
        return rows
      })
    for (var i = 0; i < list.length; i++) list[i].node.root.hidden = i < result.first
    var newest = list[list.length - 1]
    var top = list[result.first]
    if (top.view.continues && top.view.text !== '' && !(top === newest && result.cut > 0)) {
      // The top unit starts inside a sentence (a later unit of its line, or a line that carries on the
      // one before): an ellipsis says so (Netflix Turkish I.5), as on the native strip.
      top.node.text.textContent = '\u2026' + top.view.text
    }
    if (result.cut > 0) {
      // The line starts mid-sentence on screen: an ellipsis says so.
      newest.node.text.textContent = '\u2026' + newest.tokens.parts.slice(result.cut).join(newest.tokens.joiner)
      // The translation rolled: show the end of the original, as the native strip does.
      if (newest.view.original !== '') fitTail(newest.node.original, newest.view.original)
    }
  }

  var theme = null
  var words = WORDS
  var darkQuery = root.matchMedia ? root.matchMedia('(prefers-color-scheme: dark)') : null

  function applyTheme() {
    var vars = themeVars(theme, settings.theme, darkQuery !== null && darkQuery.matches)
    if (vars === null) return
    Object.keys(vars).forEach(function (name) {
      docStyle.setProperty(name, vars[name])
    })
  }

  if (darkQuery !== null && darkQuery.addEventListener) {
    darkQuery.addEventListener('change', function () {
      if (theme !== null) applyTheme()
    })
  }

  function dispatch(event) {
    if (event && event.type === 'theme') {
      theme = event.tokens
      applyTheme()
      words = applyWords(words, theme && theme.strings)
      render()
      return
    }
    var next = applyEvent(state, event, clock())
    next = advance(next, clock(), settings)
    if (next !== state) {
      state = next
      render()
    }
  }
  // The queue puts the next line up within 100 ms of its time and clears the page after its hold.
  setInterval(function () {
    var next = advance(state, clock(), settings)
    if (next !== state) {
      state = next
      render()
    }
  }, 100)

  // The width decides the wrapping, so the row limit is applied again when it changes.
  root.addEventListener('resize', function () { settings.unit_chars = 0; render() })

  var lostTimer = null
  var source = new EventSource('events')
  source.onmessage = function (message) {
    try {
      dispatch(JSON.parse(message.data))
    } catch (e) {
      // A malformed event is skipped; the next one still applies.
    }
  }
  source.onopen = function () {
    if (lostTimer !== null) {
      clearTimeout(lostTimer)
      lostTimer = null
    }
  }
  // The server stops with the session. Lines from a stream that is gone do not stay on screen.
  source.onerror = function () {
    if (lostTimer === null) {
      lostTimer = setTimeout(function () {
        lostTimer = null
        dispatch({ type: 'lost' })
      }, LOST_AFTER_MS)
    }
  }
})(globalThis)
</script>
</body>
</html>
