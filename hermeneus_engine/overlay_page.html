<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Hermeneus subtitles</title>
<style>
/* Colours, type and spacing come from the shared overlay token table; the server writes them
   here for each request (overlay_page.theme_css). */
/*HERMENEUS_THEME*/
:root {
  --text-size: 26px;
  --box-opacity: 0.8;
}
html, body {
  margin: 0;
  background: transparent;
  overflow: hidden;
}
[hidden] { display: none !important; }
#subtitles {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 6vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3em;
  font-family: var(--font-sans);
  font-size: var(--text-size);
  line-height: 1.3;
}
.line {
  position: relative;
  isolation: isolate;
  max-width: min(92vw, 40em);
  padding: 0.2em 0.55em;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  color: var(--text-primary);
  font-weight: var(--text-weight);
  text-shadow: 0 0 0.1em var(--surface), 0 0 0.25em var(--surface);
  overflow-wrap: anywhere;
}
.line::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background: var(--surface);
  opacity: var(--box-opacity);
}
.original {
  order: var(--original-order);
  max-width: 100%;
  font-size: var(--original-scale);
  color: var(--text-secondary);
  /* One row, as on the native strip: its start with an ellipsis, or its end when the
     translation rolled (fitTail below). */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.main { display: block; }
.speaker {
  font-size: var(--label-scale);
  font-weight: var(--label-weight);
  margin-inline-end: 0.5em;
}
.speaker[data-slot="1"] { color: var(--speaker-1); }
.speaker[data-slot="2"] { color: var(--speaker-2); }
.speaker[data-slot="3"] { color: var(--speaker-3); }
.speaker[data-slot="4"] { color: var(--speaker-4); }
.speaker[data-slot="5"] { color: var(--speaker-5); }
.speaker[data-slot="6"] { color: var(--speaker-6); }
.text { transition: color 120ms linear; }
.pending .text { color: var(--text-pending); }
.failed .text { color: var(--text-failed); }
/* A failed line starts with a marker in --ui-red, as the pane marks it (shared table:
   hermeneus_engine/overlay_tokens.py, role "failed"). Its words come from the pane's i18n copy
   with the theme, the same words the native strip draws (overlay/model.py Strings). */
.marker {
  color: var(--failed);
  font-size: var(--label-scale);
  font-weight: var(--label-weight);
  margin-inline-end: 0.5em;
}
</style>
</head>
<body>
<main id="subtitles" aria-live="polite"></main>
<script type="application/json" id="hermeneus-settings">{}/*HERMENEUS_SETTINGS*/</script>
<script>
(function (root) {
  'use strict'

  // Limits and defaults mirror hermeneus_engine/overlay_settings.py.
  var LIMITS = { text_size: [14, 64], max_lines: [1, 3], opacity: [0, 100] }
  var DEFAULTS = { text_size: 26, max_lines: 2, show_original: true, opacity: 80, show_speaker: true, theme: 'auto' }
  var THEMES = ['auto', 'light', 'dark']
  var LINE_STATES = ['partial', 'committed', 'translated', 'failed']
  var RUNNING = ['starting', 'live', 'reconnecting']
  var SPEAKER_SLOTS = 6
  // Lines kept in memory; the page shows at most three.
  var KEEP = 20

  function has(obj, key) {
    return Object.prototype.hasOwnProperty.call(obj, key)
  }

  function toBool(value, fallback) {
    if (typeof value === 'boolean') return value
    if (typeof value === 'number') return value !== 0
    if (typeof value === 'string') {
      var low = value.trim().toLowerCase()
      if (['1', 'true', 'yes', 'on'].indexOf(low) !== -1) return true
      if (['0', 'false', 'no', 'off'].indexOf(low) !== -1) return false
    }
    return fallback
  }

  function toInt(value, fallback, limits) {
    if (typeof value === 'boolean' || value === null || value === undefined || value === '') return fallback
    var n = Math.trunc(Number(value))
    if (!Number.isFinite(n)) return fallback
    return Math.max(limits[0], Math.min(limits[1], n))
  }

  /** Settings from the server (the plugin's shared overlay settings), then the URL query,
   *  so each OBS source can be tuned on its own. */
  function resolveSettings(base, query) {
    base = base && typeof base === 'object' ? base : {}
    var params = new URLSearchParams(query || '')
    function pick(key) {
      return params.has(key) ? params.get(key) : base[key]
    }
    var theme = String(pick('theme') || 'auto').toLowerCase()
    return {
      text_size: toInt(pick('text_size'), DEFAULTS.text_size, LIMITS.text_size),
      max_lines: toInt(pick('max_lines'), DEFAULTS.max_lines, LIMITS.max_lines),
      show_original: toBool(pick('show_original'), DEFAULTS.show_original),
      opacity: toInt(pick('opacity'), DEFAULTS.opacity, LIMITS.opacity),
      show_speaker: toBool(pick('show_speaker'), DEFAULTS.show_speaker),
      theme: THEMES.indexOf(theme) === -1 ? 'auto' : theme
    }
  }

  function createState() {
    return { seq: null, lines: [], speakers: {}, speakerCount: 0, status: null }
  }

  function text(value) {
    return typeof value === 'string' ? value : ''
  }

  // Speaker N by first appearance, as the pane numbers them (desktop/plugin.js withSpeaker,
  // applyRelabel, speakerNumber).
  function withSpeaker(state, id) {
    if (id === null || has(state.speakers, id)) return state
    var speakers = Object.assign({}, state.speakers)
    speakers[id] = state.speakerCount + 1
    return Object.assign({}, state, { speakers: speakers, speakerCount: state.speakerCount + 1 })
  }

  function applyLine(state, raw) {
    if (!raw || typeof raw !== 'object' || typeof raw.line_id !== 'string' || LINE_STATES.indexOf(raw.state) === -1) {
      return state
    }
    var line = {
      line_id: raw.line_id,
      state: raw.state,
      original: text(raw.original),
      translation: text(raw.translation),
      speaker_id: typeof raw.speaker_id === 'string' && raw.speaker_id !== '' ? raw.speaker_id : null
    }
    var lines = state.lines.slice()
    var index = -1
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].line_id === line.line_id) { index = i; break }
    }
    if (index === -1) lines.push(line)
    else lines[index] = line
    if (lines.length > KEEP) lines = lines.slice(lines.length - KEEP)
    return Object.assign({}, withSpeaker(state, line.speaker_id), { lines: lines })
  }

  function applyRelabel(state, from, to) {
    if (typeof from !== 'string' || typeof to !== 'string' || !from || !to || from === to) return state
    var lines = state.lines.map(function (line) {
      return line.speaker_id === from ? Object.assign({}, line, { speaker_id: to }) : line
    })
    var speakers = state.speakers
    if (!has(speakers, to) && has(speakers, from)) {
      speakers = Object.assign({}, speakers)
      speakers[to] = speakers[from]
    }
    return Object.assign({}, state, { lines: lines, speakers: speakers })
  }

  function clearLines(state) {
    return Object.assign({}, state, { lines: [] })
  }

  /** One event from the stream (docs/events.md). An event whose seq is not above the
   *  last applied one is a duplicate. hello sets the state only; reset drops the lines. */
  function applyEvent(state, event) {
    if (!event || typeof event !== 'object') return state
    var seq = Number.isInteger(event.seq) ? event.seq : null
    if (event.type === 'hello') {
      var session = event.session
      return session && typeof session.state === 'string' ? Object.assign({}, state, { status: session.state }) : state
    }
    if (event.type === 'reset') return Object.assign(clearLines(state), { seq: seq })
    if (event.type === 'lost') return clearLines(state)
    if (seq !== null && state.seq !== null && seq <= state.seq) return state
    var next = state
    if (event.type === 'line') next = applyLine(state, event.line)
    else if (event.type === 'relabel') next = applyRelabel(state, event.from, event.to)
    else if (event.type === 'status' && typeof event.state === 'string') {
      // A new run has new line and speaker ids, so the list and the numbering start again.
      if (event.state === 'starting' && RUNNING.indexOf(state.status) === -1) {
        next = Object.assign(createState(), { status: event.state })
      } else {
        next = Object.assign({}, state, { status: event.state })
      }
    }
    return seq === null ? next : Object.assign({}, next, { seq: seq })
  }

  /** The words the page draws; the pane's localised copy replaces them (theme event "strings"). */
  var WORDS = { speaker: 'Speaker {n}', not_translated: 'Not translated' }

  function applyWords(words, strings) {
    var out = { speaker: words.speaker, not_translated: words.not_translated }
    if (!strings || typeof strings !== 'object') return out
    if (typeof strings.speaker === 'string' && strings.speaker.indexOf('{n}') !== -1) out.speaker = strings.speaker
    if (typeof strings.not_translated === 'string' && strings.not_translated !== '') out.not_translated = strings.not_translated
    return out
  }

  /** What the page draws: the newest lines that have words, at most max_lines. One rule with the
   *  native strip (overlay/model.py segment): a "translated" line with no translation shows as
   *  failed, its original with the marker. */
  function visibleLines(state, settings, words) {
    words = words || WORDS
    if (state.status !== null && RUNNING.indexOf(state.status) === -1) return []
    var shown = state.lines.filter(function (line) {
      return (line.state === 'translated' && line.translation !== '') || line.original !== ''
    })
    return shown.slice(-settings.max_lines).map(function (line) {
      var translated = line.state === 'translated' && line.translation !== ''
      var number = line.speaker_id !== null && has(state.speakers, line.speaker_id) ? state.speakers[line.speaker_id] : null
      var failed = line.state === 'failed' || (line.state === 'translated' && !translated)
      return {
        id: line.line_id,
        text: translated ? line.translation : line.original,
        pending: line.state === 'partial' || line.state === 'committed',
        failed: failed,
        marker: failed ? words.not_translated : '',
        original: settings.show_original && translated && line.original !== '' ? line.original : '',
        speaker: settings.show_speaker && number !== null ? words.speaker.replace('{n}', String(number)) : '',
        slot: number === null ? 0 : ((number - 1) % SPEAKER_SLOTS) + 1
      }
    })
  }

  /** Tokens a line can lose from its front when it rolls: words, or characters for text
   *  written without spaces. */
  function tokensOf(value) {
    var trimmed = String(value).trim()
    if (trimmed === '') return { parts: [], joiner: ' ' }
    return /\s/.test(trimmed) ? { parts: trimmed.split(/\s+/), joiner: ' ' } : { parts: Array.from(trimmed), joiner: '' }
  }

  /** The row limit, the native strip's rule (overlay/model.py layout and _fit_turn): Lines is a
   *  number of rendered rows. Older lines leave whole while the rows overflow; when the newest
   *  line alone needs more rows, tokens leave from its front so its newest words stay visible.
   *  rowsOf(i, cut) is the row count of view i without its first `cut` tokens.
   *  Returns { first: index of the oldest line kept, cut: tokens dropped from the newest }. */
  function fitRows(tokenCounts, maxLines, rowsOf) {
    var count = tokenCounts.length
    if (count === 0) return { first: 0, cut: 0 }
    var rows = []
    var total = 0
    for (var i = 0; i < count; i++) {
      rows.push(rowsOf(i, 0))
      total += rows[i]
    }
    var first = 0
    while (count - first > 1 && total > maxLines) {
      total -= rows[first]
      first++
    }
    var newest = count - 1
    var cut = 0
    if (rows[newest] > maxLines) {
      var lo = 1
      var hi = Math.max(tokenCounts[newest] - 1, 1)
      while (lo < hi) { // the smallest cut that fits; rows only shrink as the cut grows
        var mid = (lo + hi) >> 1
        if (rowsOf(newest, mid) <= maxLines) hi = mid
        else lo = mid + 1
      }
      cut = Math.min(lo, Math.max(tokenCounts[newest] - 1, 0))
    }
    return { first: first, cut: cut }
  }

  var VAR_NAME = /^--[a-z0-9-]+$/

  /** The CSS variables to set for a theme event ({tokens: theme_tokens()} from the server):
   *  the forced mode when ?theme= names one, otherwise Desktop's mode when the pane sent a
   *  theme, otherwise the system appearance. */
  function themeVars(tokens, mode, prefersDark) {
    if (!tokens || typeof tokens !== 'object') return null
    var pick = mode === 'light' || mode === 'dark' ? tokens[mode]
      : tokens.follow_system === false ? tokens['default']
        : tokens[prefersDark ? 'dark' : 'light']
    var out = {}
    var sources = [tokens.common, pick]
    for (var i = 0; i < sources.length; i++) {
      var src = sources[i]
      if (!src || typeof src !== 'object') return null
      for (var name in src) {
        if (has(src, name) && VAR_NAME.test(name) && typeof src[name] === 'string') out[name] = src[name]
      }
    }
    return out
  }

  root.HermeneusOverlay = {
    themeVars: themeVars,
    DEFAULTS: DEFAULTS,
    LIMITS: LIMITS,
    resolveSettings: resolveSettings,
    createState: createState,
    applyEvent: applyEvent,
    applyWords: applyWords,
    visibleLines: visibleLines,
    tokensOf: tokensOf,
    fitRows: fitRows
  }

  if (typeof document === 'undefined') return

  // -- page --------------------------------------------------------------------

  var LOST_AFTER_MS = 4000
  var base = {}
  try {
    base = JSON.parse(document.getElementById('hermeneus-settings').textContent)
  } catch (e) {
    base = {}
  }
  var settings = resolveSettings(base, root.location.search)
  var docStyle = document.documentElement.style
  docStyle.setProperty('--text-size', settings.text_size + 'px')
  docStyle.setProperty('--box-opacity', String(settings.opacity / 100))
  if (settings.theme !== 'auto') document.documentElement.setAttribute('data-theme', settings.theme)

  var container = document.getElementById('subtitles')
  var nodes = {}
  var state = createState()

  function setText(el, value) {
    if (el.textContent !== value) el.textContent = value
  }

  function makeNode() {
    var rootEl = document.createElement('div')
    rootEl.className = 'line'
    var original = document.createElement('span')
    original.className = 'original'
    var main = document.createElement('span')
    main.className = 'main'
    var speaker = document.createElement('span')
    speaker.className = 'speaker'
    var marker = document.createElement('span')
    marker.className = 'marker'
    var body = document.createElement('span')
    body.className = 'text'
    main.appendChild(speaker)
    main.appendChild(marker)
    main.appendChild(body)
    rootEl.appendChild(original)
    rootEl.appendChild(main)
    return { root: rootEl, original: original, speaker: speaker, marker: marker, text: body, main: main }
  }

  // Each line keeps its element while it changes, so a partial is replaced in place by its
  // translation and nothing is torn down and rebuilt.
  function render() {
    var views = visibleLines(state, settings, words)
    var keep = {}
    for (var i = 0; i < views.length; i++) {
      var view = views[i]
      var node = nodes[view.id] || (nodes[view.id] = makeNode())
      setText(node.original, view.original)
      node.original.hidden = view.original === ''
      setText(node.speaker, view.speaker)
      node.speaker.hidden = view.speaker === ''
      node.speaker.setAttribute('data-slot', String(view.slot))
      setText(node.marker, view.marker)
      node.marker.hidden = view.marker === ''
      setText(node.text, view.text)
      node.root.classList.toggle('pending', view.pending)
      node.root.classList.toggle('failed', view.failed)
      if (container.children[i] !== node.root) container.insertBefore(node.root, container.children[i] || null)
      keep[view.id] = true
    }
    Object.keys(nodes).forEach(function (id) {
      if (!keep[id]) {
        nodes[id].root.remove()
        delete nodes[id]
      }
    })
    fit(views)
  }

  function rowsIn(el) {
    var lineHeight = parseFloat(root.getComputedStyle(el).lineHeight)
    if (!(lineHeight > 0)) return 1
    return Math.max(1, Math.round(el.getBoundingClientRect().height / lineHeight))
  }

  // An ellipsis and as much of the end of `value` as fits on the element's one row.
  function fitTail(el, value) {
    var tokens = tokensOf(value)
    el.textContent = value
    if (el.scrollWidth <= el.clientWidth || tokens.parts.length < 2) return
    var lo = 1
    var hi = tokens.parts.length - 1
    while (lo < hi) {
      var mid = (lo + hi) >> 1
      el.textContent = '\u2026' + tokens.parts.slice(mid).join(tokens.joiner)
      if (el.scrollWidth <= el.clientWidth) hi = mid
      else lo = mid + 1
    }
    el.textContent = '\u2026' + tokens.parts.slice(lo).join(tokens.joiner)
  }

  // Lines is a row limit (fitRows). Measuring happens before the browser paints, so a line
  // that does not fit is never drawn whole first.
  function fit(views) {
    if (views.length === 0) return
    var list = views.map(function (view) { return { node: nodes[view.id], tokens: tokensOf(view.text), view: view } })
    var result = fitRows(list.map(function (item) { return item.tokens.parts.length }), settings.max_lines,
      function (i, cut) {
        var item = list[i]
        if (cut > 0) item.node.text.textContent = item.tokens.parts.slice(cut).join(item.tokens.joiner)
        var rows = rowsIn(item.node.main)
        if (cut > 0) item.node.text.textContent = item.view.text
        return rows
      })
    for (var i = 0; i < list.length; i++) list[i].node.root.hidden = i < result.first
    var newest = list[list.length - 1]
    if (result.cut > 0) {
      newest.node.text.textContent = newest.tokens.parts.slice(result.cut).join(newest.tokens.joiner)
      // The translation rolled: show the end of the original, as the native strip does.
      if (newest.view.original !== '') fitTail(newest.node.original, newest.view.original)
    }
  }

  var theme = null
  var words = WORDS
  var darkQuery = root.matchMedia ? root.matchMedia('(prefers-color-scheme: dark)') : null

  function applyTheme() {
    var vars = themeVars(theme, settings.theme, darkQuery !== null && darkQuery.matches)
    if (vars === null) return
    Object.keys(vars).forEach(function (name) {
      docStyle.setProperty(name, vars[name])
    })
  }

  if (darkQuery !== null && darkQuery.addEventListener) {
    darkQuery.addEventListener('change', function () {
      if (theme !== null) applyTheme()
    })
  }

  function dispatch(event) {
    if (event && event.type === 'theme') {
      theme = event.tokens
      applyTheme()
      words = applyWords(words, theme && theme.strings)
      render()
      return
    }
    var next = applyEvent(state, event)
    if (next !== state) {
      state = next
      render()
    }
  }

  // The width decides the wrapping, so the row limit is applied again when it changes.
  root.addEventListener('resize', function () { render() })

  var lostTimer = null
  var source = new EventSource('events')
  source.onmessage = function (message) {
    try {
      dispatch(JSON.parse(message.data))
    } catch (e) {
      // A malformed event is skipped; the next one still applies.
    }
  }
  source.onopen = function () {
    if (lostTimer !== null) {
      clearTimeout(lostTimer)
      lostTimer = null
    }
  }
  // The server stops with the session. Lines from a stream that is gone do not stay on screen.
  source.onerror = function () {
    if (lostTimer === null) {
      lostTimer = setTimeout(function () {
        lostTimer = null
        dispatch({ type: 'lost' })
      }, LOST_AFTER_MS)
    }
  }
})(globalThis)
</script>
</body>
</html>
