# Windows checks for the process loopback preview. Not enabled until Seher turns
# on Actions for the repository; see the W24 report for what a hosted run can
# and cannot prove (hosted runners have no audio endpoint, so capture steps are
# diagnostic only).
name: windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hermeneus_engine/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The plugin is a flat directory that Hermes loads as is, so the project itself is not
      # installed (pip install -e . stops at setuptools' flat-layout discovery). Only its
      # dependencies are, from pyproject.toml, wheels only (rule 17). Same command locally:
      #   uv pip install --python .venv/bin/python --only-binary :all: -r pyproject.toml --extra dev
      - name: Install dependencies from pyproject.toml, wheels only
        run: |
          python -m pip install "uv==0.9.4"
          python -m uv pip install --system --only-binary :all: -r pyproject.toml --extra dev
      - name: Windows platform and loopback tests
        run: python -m pytest -q tests/test_process_loopback.py tests/test_windows_platform.py tests/test_platform_imports.py
      - name: Real COM definitions load and the worker answers (no audio needed)
        run: |
          python -c "import sys; sys.coinit_flags = 0; from hermeneus_engine.capture._wasapi import WasapiHAL; h = WasapiHAL(); print('build', h.windows_build(), 'processes', len(h.processes()), 'qpc', h.qpc_now_100ns() > 0)"
      - name: Full suite (informational; some tests are POSIX only)
        continue-on-error: true
        run: python -m pytest -q
      - name: Smoke capture (diagnostic; hosted runners usually have no audio endpoint)
        continue-on-error: true
        run: python scripts/windows_smoke.py
