name: hermeneus
version: "0.1.0"
description: "Live translation for Hermes. Captures audio playing on your Mac, transcribes it with ElevenLabs Scribe v3 Live, translates it with your Hermes model and shows live subtitles. Spoken translation is opt-in."
author: Bihruze
homepage: https://github.com/Bihruze/hermeneus
kind: standalone
license: MIT
# Hermes v0.23.1 reads this field as metadata only; the catalog entry's
# platforms gate installs. Windows is a preview (README, Windows) until it runs
# on a Windows machine.
platforms:
  - macos
requires_hermes: ">=0.23.1"
requires_env:
  - name: ELEVENLABS_API_KEY
    description: "ElevenLabs API key for Scribe v3 Live speech to text and, when turned on, spoken translation"
    url: "https://elevenlabs.io/app/settings/api-keys"
    secret: true
provides_tools: []
provides_hooks: []
config_schema:
  target_language:
    type: str
    default: ""
    label: "Translate into"
    description: "Language code to translate into, for example tr or de. The --to flag overrides it."
  capture_backend:
    type: str
    choices: [auto, process-tap, process-loopback, virtual-device]
    default: auto
    label: "Capture"
    description: "auto uses a Core Audio process tap on macOS 14.2 and later (process-loopback, WASAPI process loopback, on Windows build 20348 and later, preview), otherwise a virtual device such as BlackHole or VB-CABLE."
  source:
    type: str
    default: ""
    label: "Audio source"
    description: "Audio source to capture, as hermes hermeneus devices lists it. Empty means all system audio with a process tap. The --source flag overrides it."
  speak:
    type: bool
    default: false
    label: "Spoken translation"
    description: "Speak the translation as well as showing subtitles. The --speak flag turns it on for one session."
  commit_strategy:
    type: str
    choices: [vad, turn_prediction]
    default: vad
    label: "Segmenting"
    description: "How Scribe decides a segment is finished."
  output_device:
    type: str
    default: ""
    label: "Spoken translation output"
    description: "Output device for spoken translation. It must not feed the audio source."
  voice_id:
    type: str
    default: ""
    label: "Voice"
    description: "ElevenLabs voice id for spoken translation. Empty uses the default voice Talia."
  context_segments:
    type: int
    default: 3
    label: "Context lines"
    description: "Earlier lines sent with each translation request (0 to 10)."
  allow_remote_start:
    type: bool
    default: false
    label: "Allow start from chat platforms"
    description: "Lets /translate start and /translate set --source work from Telegram, Slack and other chat platforms. Off by default: a start from chat turns on audio capture on this computer and sends that audio to ElevenLabs while nobody may be at the computer. Status and stop work from anywhere either way."
  overlay_page:
    type: bool
    default: false
    label: "Overlay page"
    description: "Serve live subtitles on a 127.0.0.1 page for OBS browser sources and second screens while a session runs. hermes hermeneus overlay-page prints its address."
  overlay_page_port:
    type: int
    default: 47821
    label: "Overlay page port"
    description: "127.0.0.1 port for the overlay page (1024 to 65535). A port in use is an error; no other port is picked."
  overlay:
    type: bool
    default: true
    label: "Subtitle overlay"
    description: "Open the floating subtitle overlay with every session started on this Mac. It floats above other apps and never takes keyboard focus. Turn it off to keep subtitles in the pane and the terminal only."
  overlay_text_size:
    type: int
    default: 26
    label: "Overlay text size"
    description: "Translation text size in the overlay, in points (14 to 64)."
  overlay_max_lines:
    type: int
    default: 2
    label: "Overlay lines"
    description: "Lines of translation the overlay shows before older text rolls off (1 to 3)."
  overlay_show_original:
    type: bool
    default: true
    label: "Overlay shows the original"
    description: "Show the heard sentence in small text under its translation."
  overlay_opacity:
    type: int
    default: 80
    label: "Overlay background opacity"
    description: "Background opacity of the overlay in percent (0 to 100). The text stays fully opaque."
  overlay_show_speaker:
    type: bool
    default: true
    label: "Overlay speaker names"
    description: "Show Speaker 1, Speaker 2 and their colours in the overlay."
  overlay_style:
    type: str
    choices: [banner, theme]
    default: banner
    label: "Overlay style"
    description: "banner (the default) uses the Hermeneus banner colours: deep navy, periwinkle edge, warm white text. theme follows the Hermes Desktop theme."
